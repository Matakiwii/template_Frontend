<!DOCTYPE html>
<!-- DOCTYPE: Indica que es un documento HTML5 -->

<html lang="es">
<!-- <html>: con esto se define el idioma del html a español -->

<head>
  <!-- <head>: Aquí va información meta (no visible para el usuario) -->

  <meta charset="UTF-8">
  <!-- Define la codificación de caracteres (significa que la pagina acepta y entiende caracteres propios del español com ñ y tildes) -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Hace que la página sea responsive (se adapte a celulares) -->

  <meta name="description" content="Mi primera paginaaaaaa.rar">
  <!-- Descripción para buscadores (es una descripcion de la pagina que haces) -->

  <title>KIwi</title>
  <!-- Título que aparece en la pestaña del navegador -->

</head>

<body>
  <!-- <body>: Todo lo visible de la página va aquí -->

  <header>
    <!-- <header>: Encabezado principal de la página -->
    <h1>kiwi</h1>
    <!-- <h1>: Título principal. Solo debe haber uno por página -->
    <p>ola k ase</p>
     <!-- esto es para un parrafo debajo del titulo pero aca lo uso de frase solamente -->
  </header>

  <nav>
    <!-- <nav>: Sección de navegación -->
    <ul>
      <!-- <ul>: Lista sin orden (viñetas) -->
      <li><a href="#sobre-mi">Sobre mí</a></li>
      <!-- <a href="#id"> : Enlace interno a una sección de la misma página que ppresionandola te manda al titulo seleccionado-->
    </ul>
  </nav>

  <main>
    <!-- <main>: Contenido principal de la página -->

    <section id="sobre-mi">
      <!-- <section>: Bloque temático. id sirve para enlaces internos -->
      <h2>Sobre mí</h2>
      <!-- <h2>: Segundo nivel de título -->
­
      <img src="poppy.jpg" alt="Foto de perfil" width="600" height="300">
      <!-- <img>: Imagen. alt = texto alternativo (importante para accesibilidad) -->

      <p>Soy ...</p>
      <!-- comentario tipo subtitulo de la immagen -->
    </section>

  </main>

  <footer>
    <!-- <footer>: Pie de página -->
    <p>&copy; 2026 Matias Rogel- Todos los derechos reservados</p>
  
  </footer>

</body>
</html>
